name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Vendored JavaScript must match the pinned upstream release.
      - run: cd apps/web/vendor && sha256sum -c SHA256SUMS
      - run: node --check apps/web/app.js && node --check apps/web/admin.js && node --check apps/web/e2ee.js && node --check apps/web/keyring.js && node --check apps/web/level-worklet.js
      - run: node --test apps/web/tests/*.test.js
      # Sounds are synthesized by a script; both clients share sounds.js.
      - run: cmp apps/web/sounds.js apps/desktop/ui/sounds.js
      - run: python3 tools/sounds/generate.py --check

  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tinlink
          POSTGRES_PASSWORD: tinlink
          POSTGRES_DB: tinlink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tinlink"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Integration tests create one database per test on this server.
      DATABASE_URL: postgres://tinlink:tinlink@localhost:5432/tinlink
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # The desktop app is Windows first and not a default workspace member.
  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p tinlink-desktop -p tinlink-hwenc -p tinlink-webcam -p tinlink-winput --all-targets --locked -- -D warnings
      # Runners have no GPU; the hardware encoder test skips itself there.
      - run: cargo test -p tinlink-desktop -p tinlink-hwenc -p tinlink-webcam -p tinlink-winput --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t tinlink-server .
