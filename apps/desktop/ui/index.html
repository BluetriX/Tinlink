<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tinlink</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login -->
  <main id="login-view" class="center" hidden>
    <form id="login-form" class="card">
      <h1>Tinlink</h1>
      <label>Server <input id="login-server" value="https://localhost" required></label>
      <label>User name <input id="login-name" required maxlength="32" autocomplete="username"></label>
      <label id="display-name-row" hidden>Display name <input id="login-display" maxlength="64"></label>
      <label>Password <input id="login-password" type="password" required autocomplete="current-password"></label>
      <div class="row">
        <button id="login-submit" type="submit">Log in</button>
        <button id="login-toggle" type="button" class="link">Create an account</button>
      </div>
      <p id="login-error" class="error" role="alert"></p>
    </form>

    <details id="dev-panel" class="card" hidden>
      <summary>Developer: join a room with a dev token</summary>
      <form id="dev-form">
        <label>Server <input id="dev-server" value="https://localhost" required></label>
        <label>Name <input id="dev-name" required maxlength="32" autocomplete="off"></label>
        <label>Room <input id="dev-room" value="lobby" required></label>
        <button type="submit">Join</button>
      </form>
    </details>
  </main>

  <!-- Main -->
  <main id="main-view" hidden>
    <nav id="groups" aria-label="Groups">
      <div class="rail-entry">
        <button id="dm-button" type="button" title="Direct messages">@</button>
        <span id="dm-badge" class="mention-badge" hidden></span>
      </div>
      <ul id="group-list"></ul>
      <button id="group-add" type="button" class="round" title="Create or join a group">+</button>
    </nav>

    <aside id="sidebar">
      <header class="bar">
        <strong id="group-name">No group</strong>
        <button id="group-invite" type="button" class="small" hidden title="Create an invite code">Invite</button>
        <button id="group-settings" type="button" class="small" hidden title="Group settings">⚙</button>
      </header>
      <div id="channel-tree"></div>

      <section id="voice-panel">
        <div id="voice-status" class="muted">Not in voice</div>
        <div class="row">
          <button id="voice-leave" type="button" class="small" hidden>Leave</button>
          <button id="share-start" type="button" class="small" hidden>Share screen</button>
          <button id="share-stop" type="button" class="small" hidden>Stop sharing</button>
          <button id="cam-start" type="button" class="small" hidden>Camera</button>
          <button id="cam-stop" type="button" class="small" hidden>Camera off</button>
          <button id="cams-show" type="button" class="small" hidden title="Open the window with all cameras">Show cameras</button>
        </div>
        <div id="share-info" class="share-info" hidden></div>
        <div id="tx" class="tx" hidden>not transmitting</div>
        <div id="muted-hint" class="muted-hint" hidden>You are talking, but nobody hears you (push-to-talk not held or muted).</div>
        <ul id="participants"></ul>
        <details id="voice-settings">
          <summary>Voice settings</summary>
          <label class="inline"><input type="radio" name="mode" value="pushToTalk" checked> Push to talk</label>
          <label class="inline"><input type="radio" name="mode" value="voiceActivation"> Voice activation</label>
          <label>Voice activation level <span id="va-value" class="muted"></span>
            <input id="va-threshold" type="range" min="-80" max="-10" step="1" value="-50">
          </label>
          <div class="meter" title="Microphone level (active while in a voice channel)">
            <div id="meter-fill" class="meter-fill"></div>
            <div id="meter-mark" class="meter-mark"></div>
          </div>
          <div class="row">
            <label>PTT key <input id="ptt-key" value="F8" size="12"></label>
            <button id="ptt-set" type="button" class="small">Set</button>
            <button id="ptt-record" type="button" class="small" title="Press the key or mouse button to use">Record</button>
          </div>
          <label>Microphone <select id="input-device"></select></label>
          <label>Output <select id="output-device"></select></label>
          <div class="row">
            <label>Camera <select id="camera-device"></select></label>
            <label>Quality
              <select id="camera-quality">
                <option value="720" selected>720p</option>
                <option value="540">540p</option>
                <option value="360">360p</option>
              </select>
            </label>
          </div>
          <label>Screen <select id="screens"></select></label>
          <div class="row">
            <label>Resolution
              <select id="share-height">
                <option value="native">Native</option>
                <option value="1440">1440p</option>
                <option value="1080" selected>1080p</option>
                <option value="720">720p</option>
              </select>
            </label>
            <label>Max frame rate
              <select id="share-fps">
                <option value="60">60 fps</option>
                <option value="30" selected>30 fps</option>
                <option value="15">15 fps</option>
              </select>
            </label>
          </div>
        </details>
      </section>

      <footer class="bar">
        <span id="me" class="ellipsis"></span>
        <span id="gateway-dot" class="dot" title="Live updates"></span>
        <button id="profile" type="button" class="small" title="Display name, picture and password">Profile</button>
        <button id="logout" type="button" class="small">Log out</button>
      </footer>
    </aside>

    <section id="settings-view" hidden>
      <header class="bar">
        <strong id="settings-title">Group settings</strong>
        <nav id="settings-tabs" class="tabs"></nav>
        <button id="settings-close" type="button" class="small">Close</button>
      </header>
      <div id="settings-body"></div>
    </section>

    <section id="chat">
      <header class="bar">
        <strong id="channel-name">Select a channel</strong>
        <input id="search-input" type="search" placeholder="Search messages" maxlength="200" aria-label="Search messages">
      </header>
      <div id="messages" aria-live="polite"></div>
      <div id="search-results" hidden>
        <div class="search-head">
          <span id="search-summary"></span>
          <button id="search-close" type="button" class="small">Close</button>
        </div>
        <div id="search-hits"></div>
        <button id="search-more" type="button" class="small" hidden>Show older results</button>
      </div>
      <div id="typing" class="typing"></div>
      <ul id="autocomplete" class="autocomplete" hidden></ul>
      <form id="composer" hidden>
        <button id="attach" type="button" class="small" title="Attach files">Attach</button>
        <input id="file-input" type="file" multiple hidden>
        <textarea id="message-input" rows="1" placeholder="Message" maxlength="4000"></textarea>
        <button type="submit">Send</button>
      </form>
      <div id="pending-files" class="muted"></div>
    </section>
  </main>

  <p id="status" role="status"></p>

  <dialog id="dialog">
    <form method="dialog" id="dialog-form">
      <h2 id="dialog-title"></h2>
      <div id="dialog-body"></div>
      <p id="dialog-error" class="error"></p>
      <div class="row end">
        <button value="cancel" type="button" id="dialog-cancel">Cancel</button>
        <button value="ok" type="submit" id="dialog-ok">OK</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
