[package]
name = "tinlink-desktop"
description = "Tinlink desktop client: Tauri shell, media in the Rust core via the LiveKit SDK"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
base64.workspace = true
bytemuck = "1"
cpal = "0.18"
futures-util = "0.3"
# All media (capture, Opus, AEC, playout, screen capture, video encode/decode)
# runs natively in libwebrtc via the LiveKit SDK, never in the WebView.
livekit = { version = "0.9", features = ["native-tls"] }
native-tls = "0.2"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "native-tls"] }
softbuffer = "0.4"
tinlink-hwenc = { path = "../../crates/hwenc" }
tinlink-winput = { path = "../../crates/winput" }
# "unstable" enables plain windows without a webview, used for the screen viewer.
tauri = { version = "2", features = ["unstable"] }
# Same version and TLS backend as the LiveKit SDK uses.
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
# Windows toast notifications (what tauri-plugin-notification uses on
# Windows, without its Linux D-Bus dependencies).
tauri-winrt-notification = "0.8"

[dev-dependencies]
axum.workspace = true

[lints]
workspace = true
