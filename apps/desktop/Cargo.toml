[package]
name = "tinlink-desktop"
description = "Tinlink desktop client: Tauri shell, media in the Rust core via the LiveKit SDK"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bytemuck = "1"
futures-util = "0.3"
# All media (capture, Opus, AEC, playout, screen capture, video encode/decode)
# runs natively in libwebrtc via the LiveKit SDK, never in the WebView.
livekit = { version = "0.9", features = ["native-tls"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
softbuffer = "0.4"
# "unstable" enables plain windows without a webview, used for the screen viewer.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-global-shortcut = "2"

[lints]
workspace = true
