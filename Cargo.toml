[workspace]
resolver = "3"
members = ["crates/protocol", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/BluetriX/Tinlink"
publish = false

[workspace.dependencies]
tinlink-protocol = { path = "crates/protocol" }
anyhow = "1"
axum = "0.8"
bitflags = { version = "2", features = ["serde"] }
base64 = "0.23"
hmac = "0.13"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
