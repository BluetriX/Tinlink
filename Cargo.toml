[workspace]
resolver = "3"
members = ["apps/desktop", "crates/hwenc", "crates/protocol", "crates/server", "crates/webcam", "crates/winput"]
# The desktop app needs platform SDKs (WebView2, libwebrtc); it is built
# explicitly with `-p tinlink-desktop` and in its own CI job.
default-members = ["crates/protocol", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/BluetriX/Tinlink"
publish = false
license = "AGPL-3.0-only"

[workspace.dependencies]
tinlink-protocol = { path = "crates/protocol" }
anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8", features = ["ws", "multipart"] }
futures-util = "0.3"
bitflags = { version = "2", features = ["serde"] }
getrandom = "0.4"
http-body-util = "0.1"
mime = "0.3"
base64 = "0.23"
hmac = "0.13"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "migrate", "macros"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "serde-well-known"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
