[package]
name = "tinlink-e2ee"
description = "End-to-end encryption formats of Tinlink (see docs/e2ee.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "MIT OR Apache-2.0"

[dependencies]
aes-gcm = "0.11"
ed25519-dalek = "3"
getrandom.workspace = true
hkdf = "0.13"
hpke = { version = "0.15", default-features = false, features = ["alloc", "getrandom", "x25519", "aes"] }
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
base64.workspace = true
serde_json.workspace = true

[lints]
workspace = true
