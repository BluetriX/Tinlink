# cargo-deny: supply chain checks for all Rust dependencies.
# Run locally with `cargo deny check`.

[advisories]
# Fail on known vulnerabilities and unmaintained crates.
yanked = "deny"
ignore = [
    # Compile-time proc macro reached only through Tauri 2's Linux GTK
    # bindings (gtk-rs 0.18); no maintained version exists upstream yet.
    { id = "RUSTSEC-2024-0370", reason = "transitive via tauri -> gtk 0.18, build time only" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# Our own crates: AGPL server and desktop app, permissive protocol crate.
exceptions = [
    { allow = ["AGPL-3.0-only"], crate = "tinlink-server" },
    { allow = ["AGPL-3.0-only"], crate = "tinlink-desktop" },
    { allow = ["AGPL-3.0-only"], crate = "tinlink-hwenc" },
    { allow = ["AGPL-3.0-only"], crate = "tinlink-webcam" },
    { allow = ["AGPL-3.0-only"], crate = "tinlink-winput" },
    # Pulled in by Tauri / wry (HTML parsing, config dirs). MPL-2.0 is
    # file-level copyleft and compatible with AGPL; the crates are used unmodified.
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "option-ext" },
    { allow = ["MPL-2.0"], crate = "selectors" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
